{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}NUR SA, des solutions pensées pour faire avancer vos ambitions.{% endblock %}">
    <title>{% block title %}NUR SA{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/NUR SA PNG.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/NUR SA PNG.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    {% block styles %}{% endblock %}
</head>
<body>
    <header class="site-header" id="site-header">
        <a class="brand" href="{% url 'home' %}#accueil" aria-label="NUR SA, retour à l'accueil">
            <img src="{% static 'img/NUR SA Rectangle Black.png' %}" alt="NUR SA">
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Ouvrir le menu">
            <span></span><span></span>
        </button>

        <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
            <a href="{% url 'home' %}#accueil">Accueil</a>
            <a href="{% url 'about' %}">À propos</a>
            <a href="{% url 'home' %}#expertises">Nos expertises</a>
            <a href="{% url 'home' %}#realisations">Réalisations</a>
            <a href="{% url 'home' %}#partenaires">Partenaires</a>
            <a class="nav-cta" href="{% url 'contact' %}">Nous contacter</a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <a class="footer-brand" href="{% url 'home' %}#accueil">
            <img src="{% static 'img/NUR SA Rectangle Col.png' %}" alt="NUR SA">
        </a>
        <p>Data. Logiciels. Infrastructures.</p>
        <p>© <span id="current-year"></span> NUR SARL</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
